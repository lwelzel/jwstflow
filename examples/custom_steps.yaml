# yaml-language-server: $schema=jwstflow.schema.json
#
# A user workflow: start from the bundled NIRSpec IFU preset, change a few
# things, and plug in the custom steps from ./my_steps.py.
#
#   jwstflow validate custom_steps.yaml --resolve      # from any directory
#   jwstflow plan custom_steps.yaml
#   jwstflow run custom_steps.yaml --set parallel.workers=8
#
extends: preset:nirspec_ifu

plugins: [./my_steps.py]           # `my_steps:...` below resolves here and in the workers
target: NGC 1234                   # -> <project root>/reductions/ngc-1234/nirspec_ifu/
run: nirspec_ifu
description: NIRSpec IFU G395H/F290LP of NGC 1234 with a dedicated background

crds:
  path: ${env:CRDS_PATH,~/crds_cache}
  context: latest                    # resolved once and pinned in .jwstflow/manifest.json

parallel:
  backend: process
  workers: 6

download:
  program: 1234
  observations: [3, 4]               # science + background
  modes: [IFU]
  products: [UNCAL]

# `stages` entries are merged with the preset by *canonical step name* (a subclass
# of Detector1Pipeline is still `calwebb_detector1`): only the keys given here
# change; new stages are appended. Set `enabled: false` to drop a stage.
stages:
  - step: my_steps:Detector1WithSnowballMask     # replaces the preset's detector1 (same class_alias)
    parameters:
      qa_summary: true                            # our own parameter
      steps:
        clean_flicker_noise: {skip: false, fit_method: fft}

  - step: spec2
    parameters:
      steps:
        nsclean: {skip: true}

  - step: quicklook_image
    enabled: false

  # ---- new stages (directories: stage3/extract_1d, stage4/spectrum_report, stage4/tag_header)
  - step: my_steps:Extract1dWideAperture          # an official step, subclassed: stays `extract_1d`
    inputs:
      - {stage: calwebb_spec3, pattern: "*_s3d.fits"}

  - step: my_steps:SpectrumReport                 # jwstflow.Step, batch=all
    inputs:
      - {stage: calwebb_spec3, pattern: "*_x1d.fits"}
      - {stage: extract_1d, pattern: "*_x1d.fits"}
    parameters: {min_snr: 5}
    tags: [qa]

  - step: my_steps:tag_header                     # plain function
    inputs:
      - {stage: calwebb_spec3, pattern: "*_s3d.fits"}
    parameters: {keyword: PROJECT, value: ngc1234}
    tags: [qa]
