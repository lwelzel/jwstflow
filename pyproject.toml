[project]
name = "jwstflow"
version = "0.1.0"
description = "Lightweight YAML-driven orchestrator for the official JWST calibration pipeline (NIRSpec + MIRI)."
authors = [
    { name = "Lukas Welzel", email = "welzel@strw.leidenuniv.nl" }
]
requires-python = ">=3.12"
keywords = ["jwst", "nirspec", "miri", "pipeline", "stpipe", "astronomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=8.0.1",
    "astroquery>=0.4.11",
    "cmasher>=1.9.2",
    "dask>=2026.8.0",
    "distributed>=2026.8.0",
    "jwst>=3.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.1",
]

# Contributed step packages are separate distributions that depend on jwstflow and
# register their steps in the `jwstflow.steps` entry-point group; the core never
# references them. Install whichever you have access to, e.g.:
#   uv pip install jwstflow-midas                          # public, PyPI/git
#   uv pip install git+ssh://git@github.com/<org>/jwstflow-joys  # private
# `jwstflow steps` lists whatever is installed.

# The stpsf engine of the psf_cube step (docs/psf_cubes.md). The step and the
# psfcube-product contract ship with the core; only generation needs the extra
# (plus the stpsf data files: $STPSF_PATH, or stpsf downloads them on first use).
[project.optional-dependencies]
psf = ["stpsf>=2.0"]

[project.scripts]
jwstflow = "jwstflow.cli:app"

# QA steps shipped with the core package, by name
[project.entry-points."jwstflow.steps"]
plot_spectrum = "jwstflow.contrib.qa:PlotSpectrum"
quicklook_image = "jwstflow.contrib.qa:QuicklookImage"
plot_stitch = "jwstflow.contrib.qa:PlotStitch"
plot_stitch_background = "jwstflow.contrib.qa:PlotStitchBackground"
header_summary = "jwstflow.contrib.qa:HeaderSummary"
fix_msa_metafile = "jwstflow.contrib.nirspec:fix_msa_metafile"
mast_compare = "jwstflow.contrib.mast_compare:MastCompare"
stitch_segments = "jwstflow.stitching:StitchSegments"
psf_cube = "jwstflow.contrib.psf:PsfCube"
qa_psf_cube = "jwstflow.contrib.psf:QaPsfCube"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]   # the migration/ staging repos carry their own suites
markers = [
    "integration: complete mock-observation workflow through the engine (seconds, offline; deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
