[project]
name = "jwstflow"
version = "0.2.1"
description = "Lightweight YAML-driven orchestrator for the official JWST calibration pipeline (NIRSpec + MIRI)."
readme = "README.md"
authors = [
    { name = "Lukas Welzel", email = "welzel@strw.leidenuniv.nl" }
]
requires-python = ">=3.12"
keywords = ["jwst", "nirspec", "miri", "pipeline", "stpipe", "astronomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=8.0.1",
    "astroquery>=0.4.11",
    "cmasher>=1.9.2",
    "dask>=2026.8.0",
    "distributed>=2026.8.0",
    "jwst>=3.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.1",
]

# Contributed step packages are separate distributions that depend on jwstflow and
# register their steps in the `jwstflow.steps` entry-point group; the core never
# references them. Install whichever you have access to, e.g.:
#   uv pip install jwstflow-midas                          # public, PyPI/git
#   uv pip install git+ssh://git@github.com/<org>/jwstflow-joys  # private
# `jwstflow steps` lists whatever is installed.

# The stpsf engine of the psf_cube step (docs/psf_cubes.md). The step and the
# psfcube-product contract ship with the core; only generation needs the extra
# (plus the stpsf data files: $STPSF_PATH, or stpsf downloads them on first use).
[project.optional-dependencies]
psf = ["stpsf>=2.0"]

[project.urls]
Homepage = "https://github.com/lwelzel/jwstflow"
Repository = "https://github.com/lwelzel/jwstflow"
Issues = "https://github.com/lwelzel/jwstflow/issues"

[project.scripts]
jwstflow = "jwstflow.cli:app"

# jwstflow's own steps, by name: this is the one list. Each entry names the module that *defines* the
# step (that file is hashed into the task ids and read for `jwstflow steps`).
[project.entry-points."jwstflow.steps"]
# data steps: each lives with the feature it implements
stitch_segments = "jwstflow.spectra.stitching:StitchSegments"
psf_cube = "jwstflow.cubes.psf.steps:PsfCube"
flag_spaxel_clusters = "jwstflow.cubes.clusters.steps:FlagSpaxelClusters"
propagate_cluster_flags = "jwstflow.cubes.clusters.steps:PropagateClusterFlags"
fix_msa_metafile = "jwstflow.data.msa:fix_msa_metafile"
# QA steps: jwstflow.qa.steps
plot_spectrum = "jwstflow.qa.steps.spectra:PlotSpectrum"
plot_snr = "jwstflow.qa.steps.spectra:PlotSnr"
plot_spectrum_stages = "jwstflow.qa.steps.spectra:PlotSpectrumStages"
plot_stitch = "jwstflow.qa.steps.stitch:PlotStitch"
plot_stitch_overlaps = "jwstflow.qa.steps.stitch:PlotStitchOverlaps"
plot_stitch_background = "jwstflow.qa.steps.stitch:PlotStitchBackground"
quicklook_image = "jwstflow.qa.steps.images:QuicklookImage"
qa_cube_summary = "jwstflow.qa.steps.cubes:QaCubeSummary"
qa_cube_slices = "jwstflow.qa.steps.cubes:QaCubeSlices"
qa_psf_cube = "jwstflow.qa.steps.psf:QaPsfCube"
qa_spaxel_clusters = "jwstflow.qa.steps.clusters:QaSpaxelClusters"
mast_compare = "jwstflow.qa.steps.mast_compare:MastCompare"
header_summary = "jwstflow.qa.steps.summary:HeaderSummary"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]   # the migration/ staging repos carry their own suites
markers = [
    "integration: complete mock-observation workflow through the engine (seconds, offline; deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
