[project]
name = "jwstflow"
version = "0.1.0"
description = "Lightweight YAML-driven orchestrator for the official JWST calibration pipeline (NIRSpec + MIRI)."
authors = [
    { name = "Lukas Welzel", email = "welzel@strw.leidenuniv.nl" }
]
requires-python = ">=3.12"
keywords = ["jwst", "nirspec", "miri", "pipeline", "stpipe", "astronomy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "astropy>=8.0.1",
    "astroquery>=0.4.11",
    "cmasher>=1.9.2",
    "dask>=2026.8.0",
    "distributed>=2026.8.0",
    "jwst>=3.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.1",
]

# Contributed step packages: optional, resolved from this workspace.
# Not installed by default. 
# Install: 
#   `uv sync --extra joys` (or `--all-extras`)
# Alternative pip install:
#   `pip install jwstflow[joys]`
[project.optional-dependencies]
joys = ["jwstflow-joys"]

[project.scripts]
jwstflow = "jwstflow.cli:app"

# QA steps shipped with the core package, by name
[project.entry-points."jwstflow.steps"]
plot_spectrum = "jwstflow.contrib.qa:PlotSpectrum"
quicklook_image = "jwstflow.contrib.qa:QuicklookImage"
header_summary = "jwstflow.contrib.qa:HeaderSummary"
fix_msa_metafile = "jwstflow.contrib.nirspec:fix_msa_metafile"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[tool.uv.workspace]
members = ["contrib_packages/*"]

[tool.uv.sources]
jwstflow-joys = { 
    workspace = true,
    # index = "joys", # cannot specify both, TODO when jwst becomes public but JOYS+ pipeline remains private
}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
