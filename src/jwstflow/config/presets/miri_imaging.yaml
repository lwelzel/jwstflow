# yaml-language-server: $schema=jwstflow.schema.json
# MIRI imaging: uncal -> detector1 -> image2 -> image3 (mosaic per filter) -> quick-looks
version: 1
run: miri_imaging
# target: set in your workflow (extends: preset:...); results go to <workspace>/<target>/miri_imaging/

crds: {path: "${env:CRDS_PATH,~/crds_cache}", context: null}
parallel: {backend: process, workers: 4}

download:
  program: 1234
  instrument: MIRI
  modes: [IMAGE]
  products: [UNCAL]

stages:
  - step: detector1
    inputs:
      - {stage: raw, pattern: "*_uncal.fits", filters: {EXP_TYPE: [MIR_IMAGE]}}

  - step: image2
    inputs:
      - {stage: calwebb_detector1, pattern: "*_rate.fits"}
    association:
      mode: per_exposure
      level: 2
      members:
        - exptype: background
          filters: {BKGDTARG: true}
          match_on: [FILTER, SUBARRAY]

  - step: image3
    inputs:
      - {stage: calwebb_image2, pattern: "*_cal.fits"}
    association:
      mode: group
      level: 3
      group_by: [PROGRAM, OBSERVTN, FILTER]
      product_name: "jw{PROGRAM}-o{OBSERVTN}_{TARGID}_miri_{FILTER}"
    parameters:
      steps:
        tweakreg: {skip: false}
        skymatch: {skymethod: match}
        source_catalog: {snr_threshold: 5}

  - step: quicklook_image
    inputs:
      - {stage: calwebb_image3, pattern: "*_i2d.fits"}
    tags: [qa]
