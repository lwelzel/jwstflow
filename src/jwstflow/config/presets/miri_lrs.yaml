# yaml-language-server: $schema=jwstflow.schema.json
# MIRI LRS fixed slit: uncal -> detector1 -> spec2 (nod subtraction) -> spec3 -> plots
version: 1
run: miri_lrs
# target: set in your workflow (extends: preset:...); results go to <workspace>/<target>/miri_lrs/

crds: {path: "${env:CRDS_PATH,~/crds_cache}", context: null}
parallel: {backend: process, workers: 4}

download:
  program: 1234
  instrument: MIRI
  modes: [SLIT]
  products: [UNCAL]

stages:
  - step: detector1
    inputs:
      - {stage: raw, pattern: "*_uncal.fits", filters: {EXP_TYPE: [MIR_LRS-FIXEDSLIT]}}

  - step: spec2
    inputs:
      - {stage: calwebb_detector1, pattern: "*_rate.fits"}
    association:
      mode: per_exposure
      level: 2
      members:
        - exptype: background
          filters: {BKGDTARG: false}
          match_on: [OBSERVTN, VISIT, DETECTOR, FILTER]
          differ_on: [PATT_NUM]

  - step: spec3
    inputs:
      - {stage: calwebb_spec2, pattern: "*_cal.fits"}
    association:
      mode: group
      level: 3
      group_by: [PROGRAM, OBSERVTN]
      product_name: "jw{PROGRAM}-o{OBSERVTN}_{TARGID}_miri_lrs"

  - step: plot_spectrum
    inputs:
      - {stage: calwebb_spec3, pattern: "*_x1d.fits"}
    tags: [qa]
