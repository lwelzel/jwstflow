# yaml-language-server: $schema=jwstflow.schema.json
# MIRI MRS: uncal -> detector1 -> spec2 -> spec3 (all bands of an observation,
#           dedicated backgrounds via master background) -> plots
version: 1
run: miri_mrs
# target: set in your workflow (extends: preset:...); results go to <workspace>/<target>/miri_mrs/

crds: {path: "${env:CRDS_PATH,~/crds_cache}", context: null}
parallel: {backend: process, workers: 4}

download:
  program: 1234
  instrument: MIRI
  modes: [IFU]
  products: [UNCAL]

stages:
  - step: detector1
    inputs:
      - {stage: raw, pattern: "*_uncal.fits", filters: {EXP_TYPE: [MIR_MRS]}}
    parameters:
      steps:
        jump: {expand_large_events: true, three_group_rejection_threshold: 6}
        # emicorr: {skip: false}   # MIRI EMI correction (on by default in recent versions)

  - step: spec2
    inputs:
      - {stage: calwebb_detector1, pattern: "*_rate.fits"}
    association:
      mode: per_exposure
      level: 2
    parameters:
      steps:
        residual_fringe: {skip: false}
        cube_build: {skip: true}
        extract_1d: {skip: true}

  - step: spec3
    inputs:
      - {stage: calwebb_spec2, pattern: "*_cal.fits"}
    association:
      mode: group
      level: 3
      group_by: [PROGRAM, OBSERVTN]              # one product per observation, all bands
      product_name: "jw{PROGRAM}-o{OBSERVTN}_{TARGID}_miri"
      science_filters: {BKGDTARG: false}
      members:
        - exptype: background
          filters: {BKGDTARG: true}
          match_on: [CHANNEL, BAND]
    parameters:
      steps:
        outlier_detection: {skip: false, kernel_size: "11 1", threshold_percent: 99.5}
        cube_build: {output_type: band, coord_system: skyalign}
        extract_1d: {ifu_autocen: true, ifu_rfcorr: true}

  - step: plot_spectrum
    inputs:
      - {stage: calwebb_spec3, pattern: "*_x1d.fits"}
    tags: [qa]
