# yaml-language-server: $schema=jwstflow.schema.json
# NIRSpec fixed slit: uncal -> detector1 -> spec2 (nod subtraction) -> spec3 -> plots
version: 1
run: nirspec_fs
# target: set in your workflow (extends: preset:...); results go to <workspace>/<target>/nirspec_fs/

crds: {path: "${env:CRDS_PATH,~/crds_cache}", context: null}
parallel: {backend: process, workers: 4}

download:
  program: 1234
  instrument: NIRSPEC
  modes: [SLIT]
  products: [UNCAL]

stages:
  - step: detector1
    inputs:
      - {stage: raw, pattern: "*_uncal.fits", filters: {EXP_TYPE: [NRS_FIXEDSLIT]}}

  - step: spec2
    inputs:
      - {stage: calwebb_detector1, pattern: "*_rate.fits"}
    association:
      mode: per_exposure
      level: 2
      members:
        - exptype: background
          filters: {BKGDTARG: false}
          match_on: [OBSERVTN, VISIT, DETECTOR, GRATING, FILTER]
          differ_on: [PATT_NUM]

  - step: spec3
    inputs:
      - {stage: calwebb_spec2, pattern: "*_cal.fits"}
    association:
      mode: group
      level: 3
      group_by: [PROGRAM, OBSERVTN, GRATING, FILTER]
      product_name: "jw{PROGRAM}-o{OBSERVTN}_{TARGID}_nirspec_{OPTELEM}"

  - step: plot_spectrum
    inputs:
      - {stage: calwebb_spec3, pattern: "*_x1d.fits"}
    tags: [qa]
