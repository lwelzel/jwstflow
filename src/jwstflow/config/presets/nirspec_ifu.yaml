# yaml-language-server: $schema=jwstflow.schema.json
# ---------------------------------------------------------------------------
# NIRSpec IFU: uncal -> detector1 -> spec2 (+ imprint subtraction)
#               -> spec3 (master background from dedicated background obs)
#               -> quick-look plots
# Start from it with:   jwstflow init nirspec_ifu --extend -o my_run.yaml
# ---------------------------------------------------------------------------
version: 1
run: nirspec_ifu
# target: set in your workflow (extends: preset:...); results go to <workspace>/<target>/nirspec_ifu/

crds:
  path: ${env:CRDS_PATH,~/crds_cache}
  context: null            # e.g. jwst_1364.pmap, or "latest" to resolve+pin

parallel:
  backend: process
  workers: 4
  threads_per_worker: 1

download:
  program: 1234
  observations: null       # [1, 2]  (science + background observations)
  instrument: NIRSPEC
  modes: [IFU]
  products: [UNCAL]

stages:
  - step: detector1
    inputs:
      - {stage: raw, pattern: "*_uncal.fits", filters: {EXP_TYPE: [NRS_IFU]}}
    parameters:
      steps:
        # Common NIRSpec IFU choices; everything here maps 1:1 to the jwst docs.
        jump: {expand_large_events: true}        # snowball flagging
        clean_flicker_noise: {skip: true}         # set false for 1/f cleaning
        # ramp_fit: {maximum_cores: half}         # only with parallel: false (see docs)

  - step: spec2
    inputs:
      - {stage: calwebb_detector1, pattern: "*_rate.fits"}
    association:
      mode: per_exposure
      level: 2
      # Science AND background exposures get their own product (needed for spec3);
      # imprint (leakcal) exposures become "imprint" members of their partner.
      members:
        - exptype: imprint
          filters: {IS_IMPRT: true}
          match_on: [OBSERVTN, DETECTOR, GRATING, FILTER, BKGDTARG]
          # add PATT_NUM to match_on to pin imprints to the same dither position
    parameters:
      steps:
        cube_build: {skip: true}                  # per-exposure cubes are rarely needed
        extract_1d: {skip: true}

  - step: spec3
    inputs:
      - {stage: calwebb_spec2, pattern: "*_cal.fits"}
    association:
      mode: group
      level: 3
      group_by: [PROGRAM, OBSERVTN, GRATING, FILTER]
      product_name: "jw{PROGRAM}-o{OBSERVTN}_{TARGID}_nirspec_{GRATING}"   # cube_build appends _<grating>-<filter> itself
      science_filters: {BKGDTARG: false, IS_IMPRT: false}
      members:
        - exptype: background
          filters: {BKGDTARG: true, IS_IMPRT: false}
          match_on: [GRATING, FILTER]
    parallel: true
    parameters:
      steps:
        outlier_detection: {skip: false}
        cube_build: {coord_system: skyalign}      # or ifualign
        extract_1d: {ifu_autocen: true}

  - step: plot_spectrum
    inputs:
      - {stage: calwebb_spec3, pattern: "*_x1d.fits"}
    tags: [qa]

  - step: quicklook_image
    inputs:
      - {stage: calwebb_spec3, pattern: "*_s3d.fits"}
    tags: [qa]
