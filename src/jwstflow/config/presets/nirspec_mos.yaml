# yaml-language-server: $schema=jwstflow.schema.json
# NIRSpec MOS (MSA): uncal -> detector1 -> msa keyword fix -> spec2 (nod subtraction)
#                    -> spec3 -> plots
version: 1
run: nirspec_mos
# target: set in your workflow (extends: preset:...); results go to <workspace>/<target>/nirspec_mos/

crds: {path: "${env:CRDS_PATH,~/crds_cache}", context: null}
parallel: {backend: process, workers: 4}

download:
  program: 1234
  instrument: NIRSPEC
  modes: [MSA]
  products: [UNCAL, MSA]   # the *_msa.fits metadata files are required by spec2

stages:
  - step: detector1
    inputs:
      - {stage: raw, pattern: "*_uncal.fits", filters: {EXP_TYPE: [NRS_MSASPEC]}}
    parameters:
      steps:
        jump: {expand_large_events: true}

  # spec2 opens the file named in MSAMETFL; make that an absolute path into the target's raw directory
  - step: jwstflow.contrib.nirspec:fix_msa_metafile
    inputs:
      - {stage: calwebb_detector1, pattern: "*_rate.fits"}
    parameters: {search: raw}

  - step: spec2
    depends_on: [fix_msa_metafile]
    inputs:
      - {stage: calwebb_detector1, pattern: "*_rate.fits"}
    association:
      mode: per_exposure
      level: 2
      members:
        # other nod positions of the same exposure sequence act as background
        - exptype: background
          filters: {IS_IMPRT: false, BKGDTARG: false}
          match_on: [OBSERVTN, VISIT, DETECTOR, GRATING, FILTER]
          differ_on: [PATT_NUM]
        - exptype: imprint
          filters: {IS_IMPRT: true}
          match_on: [OBSERVTN, DETECTOR, GRATING, FILTER]
    parameters:
      steps:
        master_background_mos: {skip: true}    # nod subtraction is done by bkg_subtract

  - step: spec3
    inputs:
      - {stage: calwebb_spec2, pattern: "*_cal.fits"}
    association:
      mode: group
      level: 3
      group_by: [PROGRAM, OBSERVTN, GRATING, FILTER]
      product_name: "jw{PROGRAM}-o{OBSERVTN}_{TARGID}_nirspec_{OPTELEM}"

  - step: plot_spectrum
    inputs:
      - {stage: calwebb_spec3, pattern: "*_x1d.fits"}
    tags: [qa]
