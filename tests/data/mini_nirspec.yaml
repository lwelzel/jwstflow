# Mini NIRSpec-IFU workflow over the stub pipelines, addressed by dotted path so it
# also runs on the process backend (spawned workers import the stubs themselves).
# Used by tests/test_mock_workflow.py; overrides point workspace/crds at a tmp dir.
version: 1
target: ESO-Ha 569
run: mini_nirspec
description: mock detector1 -> spec2 -> per-dither cubes -> cluster flags -> spec3 -> QA, end to end

crds: {context: jwst_1364.pmap, prefetch: false}
parallel: {backend: process, workers: 2}

stages:
  - step: jwstflow.testing.mock:StubDetector1
    inputs:
      - {stage: raw, pattern: "*_uncal.fits", filters: {EXP_TYPE: NRS_IFU}}

  - step: jwstflow.testing.mock:StubSpec2
    inputs:
      - {stage: calwebb_detector1, pattern: "*_rate.fits"}
    association: {mode: per_exposure, level: 2, asn_type: spec2}

  # the bad-cluster chain (jwstflow.clusters): per-dither cubes -> which dither / which
  # spaxels -> DQ flags on the detector pixels behind them; spec3 consumes the flagged frames
  - step: jwstflow.testing.mock:StubCubeBuild
    variant: perdither
    inputs:
      - {stage: calwebb_spec2, pattern: "*_cal.fits"}
    association:
      mode: group
      level: 3
      asn_type: spec3
      group_by: [PROGRAM, OBSERVTN, GRATING, FILTER, PATT_NUM]
      product_name: "jw{PROGRAM}-o{OBSERVTN}_{TARGID}_nirspec_dither{PATT_NUM}_{GRATING}"

  - step: flag_spaxel_clusters
    inputs:
      - {stage: cube_build-perdither, pattern: "*_s3d.fits"}
    parameters:
      regions:
        # the mock scene's injected cluster: 0.4" east / 0.4" north of the field centre, dither 2
        - {id: mock-blob, ra: 167.788983, dec: -76.695889, radius: 0.35, wave_min: 4.52, wave_max: 4.61,
           where: {GRATING: G395H}}
      grow: 0

  - step: propagate_cluster_flags
    inputs:
      - {stage: calwebb_spec2, pattern: "*_cal.fits"}
    depends_on: [flag_spaxel_clusters]

  - step: jwstflow.testing.mock:StubSpec3
    inputs:
      - {stage: propagate_cluster_flags, pattern: "*_cal.fits"}
    association:
      mode: group
      level: 3
      asn_type: spec3
      group_by: [PROGRAM, OBSERVTN, GRATING, FILTER]
      product_name: "jw{PROGRAM}-o{OBSERVTN}_{TARGID}_nirspec_{GRATING}"
    parameters:
      steps:
        extract_1d: {skip: false}

  # offline engine: the analytic Gaussian PSF exercises the psfcube contract end to end
  - step: psf_cube
    inputs:
      - {stage: calwebb_spec3, pattern: "*_s3d.fits"}
    parameters: {engine: gaussian, oversample: 2, fov_arcsec: 1.6, n_wavelengths: 5}

  - step: qa_psf_cube
    inputs:
      - {stage: psf_cube, pattern: "*_psfcube.fits"}
    tags: [qa]

  - step: quicklook_image
    inputs:
      - {stage: calwebb_spec3, pattern: "*_s3d.fits"}
    tags: [qa]

  - step: qa_spaxel_clusters
    inputs:
      - {stage: flag_spaxel_clusters, pattern: "*_clustermask.fits"}
    tags: [qa]

  - step: plot_spectrum
    inputs:
      - {stage: calwebb_spec3, pattern: "*_x1d.fits"}
    tags: [qa]
